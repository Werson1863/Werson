name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Kitöltendő TODO-k száma (tájékoztató)
        run: npm run todos | tail -1
